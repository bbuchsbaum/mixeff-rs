name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly external-parity refresh: checked-in fixtures and comparison
    # artifacts rot silently as MixedModels.jl / lme4 evolve, so re-check
    # them on a schedule.
    - cron: "0 6 * * 1"
  # Manual trigger for the external-parity jobs (e.g. after an upstream
  # MixedModels.jl or lme4 release) without waiting for the weekly cron.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            os: ubuntu-latest
            command: cargo test
          - name: default
            os: macos-latest
            command: cargo test
          - name: default
            os: windows-latest
            command: cargo test
          - name: nlopt
            os: ubuntu-latest
            command: cargo test --features nlopt
          - name: no-default-features
            os: ubuntu-latest
            command: cargo test --no-default-features
          - name: no-default+unstable
            os: ubuntu-latest
            command: cargo test --no-default-features --features unstable-internals
          - name: faer-backend
            os: ubuntu-latest
            command: cargo test --features faer-backend
          - name: prima
            os: ubuntu-latest
            command: cargo test --no-default-features --features prima
          # Runs on every push/PR (no schedule guard) so the gated
          # compiler/datasets/pathology contract tests stay continuously
          # covered even though that surface is not part of the stable 1.0 API.
          - name: unstable-internals
            os: ubuntu-latest
            command: cargo test --features unstable-internals
          - name: nlopt+unstable
            os: ubuntu-latest
            command: cargo test --features "nlopt unstable-internals"
          # Release-mode test leg: optimizer/Cholesky behavior can differ
          # between debug and release builds (FMA contraction, inlining), so
          # this is a required blocking job, not optional.
          - name: release
            os: ubuntu-latest
            command: cargo test --release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NLopt build prerequisites
        if: matrix.name != 'no-default-features' && matrix.name != 'no-default+unstable' && matrix.name != 'prima' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Install PRIMA C library
        if: matrix.name == 'prima' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gfortran
          git clone --depth 1 --branch v0.7.2 https://github.com/libprima/prima.git "$RUNNER_TEMP/prima"
          cmake -S "$RUNNER_TEMP/prima" -B "$RUNNER_TEMP/prima-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prima-install"
          cmake --build "$RUNNER_TEMP/prima-build" --target install --parallel
          echo "PRIMA_DIR=$RUNNER_TEMP/prima-install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/prima-install/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Run tests
        run: ${{ matrix.command }}

  # Serial vs threaded bit-identity on the toolchain the R package builds
  # with on Windows (x86_64-pc-windows-gnu; R >= 4.5 uses Rtools45).
  # mingw-w64's libm evaluates exp/log/pow/... with x87 instructions, so
  # results depend on the per-thread x87 precision control; R's main thread
  # runs `fninit` (extended precision) while new threads start at the
  # Windows default (double precision). The `*extended_precision*` tests
  # put the calling thread into R's state and fail unless worker threads
  # inherit it (`parallel::FloatingPointEnv`). The MSVC leg above links the
  # UCRT's SSE2 libm and cannot catch this.
  windows-gnu-determinism:
    name: windows-gnu thread determinism (${{ matrix.linker }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # rust-mingw: Rust's self-contained mingw-w64 linker and libraries.
        # rtools45: Rtools45's gcc as linker, as `R CMD INSTALL` builds it.
        linker: [rust-mingw, rtools45]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (x86_64-pc-windows-gnu host toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - uses: r-lib/actions/setup-r@v2
        if: matrix.linker == 'rtools45'
        with:
          r-version: release
          rtools-version: "45"
      - name: Use the Rtools45 linker
        if: matrix.linker == 'rtools45'
        shell: pwsh
        run: |
          $bin = "C:\rtools45\x86_64-w64-mingw32.static.posix\bin"
          if (-not (Test-Path "$bin\x86_64-w64-mingw32.static.posix-gcc.exe")) {
            Get-ChildItem C:\rtools45 | Out-Host
            throw "Rtools45 gcc not found in $bin"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32.static.posix-gcc.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Rtools' static toolchain has no libgcc_eh, which Rust's
          # windows-gnu std links; R packages (mixeff's Makevars.win, the
          # extendr template) put an empty stand-in on LIBRARY_PATH.
          $mock = Join-Path $env:RUNNER_TEMP "libgcc_mock"
          New-Item -ItemType Directory -Force -Path $mock | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $mock "libgcc_eh.a") | Out-Null
          "LIBRARY_PATH=$mock" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Show linker
        if: matrix.linker == 'rtools45'
        run: x86_64-w64-mingw32.static.posix-gcc --version
      # Filters: worker/control-state tests in `parallel::`, and every
      # serial-vs-threaded identity test (bootstrap LMM/GLMM incl. the
      # test-threads.R Poisson nsim = 20 / seed = 2 case, profiles).
      - name: Thread determinism tests (debug)
        run: >-
          cargo test --target x86_64-pc-windows-gnu --no-default-features --lib --
          parallel:: threads_are_bit_identical threads_match
          with_threads_is_bit_identical
      - name: Thread determinism tests (release)
        run: >-
          cargo test --release --target x86_64-pc-windows-gnu --no-default-features --lib --
          parallel:: threads_are_bit_identical threads_match
          with_threads_is_bit_identical

  lint:
    name: lint (fmt + clippy + doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install NLopt build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy unstable-internals (deny warnings)
        run: cargo clippy --all-targets --features unstable-internals -- -D warnings
      - name: rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # NLopt requires CMake/C++ toolchain; skip it for the MSRV leg by using
      # --no-default-features so we avoid C/CMake MSRV coupling while still
      # actually running tests (not just checking) at the declared MSRV.
      - name: cargo test at pinned MSRV (no-default-features)
        run: cargo +1.85 test --no-default-features

  supply-chain:
    name: cargo deny + cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  julia-parity:
    name: Julia parity fixtures (scheduled)
    # Only on the weekly schedule or a manual dispatch: the parity gate needs
    # a Julia toolchain plus MixedModels.jl and is too slow for every push/PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned: the fixture provenance strings record the exact Julia and
      # MixedModels.jl versions, and scripts/julia/Manifest.toml is resolved
      # for this Julia. Bump both together (see VERSIONING.md §2.E).
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.4"
      - name: Install Julia parity dependencies (pinned Manifest)
        run: julia --project=scripts/julia -e 'using Pkg; Pkg.instantiate()'
      - name: Check Julia parity fixtures
        run: bash scripts/check_julia_parity_fixtures.sh
      - name: Record engine provenance
        if: always()
        run: julia --project=scripts/julia -e 'using Pkg; Pkg.status(["MixedModels", "DataFrames", "JSON3", "CategoricalArrays"])'

  lme4-parity:
    name: lme4 comparison refresh (scheduled)
    # Only on the weekly schedule or a manual dispatch: regenerates the
    # comparison artifacts against a live R/lme4 and re-runs the parity
    # scorecard gate, which catches unreviewed classification drift.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NLopt build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R comparison dependencies
        run: Rscript -e 'install.packages(c("lme4", "jsonlite"))'
      # The same sequence as scripts/check_release_lme4_parity.sh, but
      # without its restore-on-exit behavior so the regenerated artifacts
      # stay in the tree for the drift diff and upload below.
      - name: Regenerate Rust comparison results
        run: cargo run --release --features unstable-internals --example compare_rust
      - name: Regenerate lme4 comparison results
        run: Rscript scripts/compare_lme4.R
      - name: Regenerate comparison report
        run: cargo run --release --features unstable-internals --example compare_report
      - name: Parity scorecard gate (catches unreviewed classification drift)
        run: cargo test --features unstable-internals --test parity_scorecard
      - name: Show comparison drift against checked-in artifacts
        if: always()
        run: git --no-pager diff --stat comparison/ || true
      - name: Upload regenerated comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lme4-comparison-refresh
          path: |
            comparison/manifest.json
            comparison/rust_results.json
            comparison/lme4_results.json
            comparison/REPORT.md
          if-no-files-found: warn
