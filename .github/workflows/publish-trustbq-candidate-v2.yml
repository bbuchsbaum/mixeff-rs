name: Publish clean TrustBQ candidate v2

on:
  push:
    branches: ["experiment/trustbq-optimizer-gpt56"]
    paths:
      - ".github/workflows/publish-trustbq-candidate-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/trustbq-optimizer-gpt56
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply candidate to clean main
        run: |
          cp .github/experiments/trustbq-model-maintenance.patch "$RUNNER_TEMP/trustbq-model-maintenance.patch"
          cp audit/trustbq-model-reuse-proof.md "$RUNNER_TEMP/trustbq-model-reuse-proof.md"
          git fetch origin main
          git checkout --detach origin/main
          git apply "$RUNNER_TEMP/trustbq-model-maintenance.patch"
          cp "$RUNNER_TEMP/trustbq-model-reuse-proof.md" audit/trustbq-model-reuse-proof.md
          cargo fmt --all
          git diff --check -- src/optimizer/trust_bq.rs src/model/linear/optimizer.rs audit/trustbq-model-reuse-proof.md
      - name: Dependency-light candidate test suite
        run: cargo test --no-default-features
      - name: Commit and publish review branch
        run: |
          git config user.name "OpenAI Assistant"
          git config user.email "assistant@openai.com"
          git add src/optimizer/trust_bq.rs src/model/linear/optimizer.rs audit/trustbq-model-reuse-proof.md
          git commit -m "Reuse TrustBQ local models conservatively"
          git push --force origin HEAD:perf/trustbq-model-reuse-gpt56
