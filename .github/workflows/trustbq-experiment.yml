name: TrustBQ optimizer experiment

on:
  push:
    branches:
      - "experiment/trustbq-optimizer-gpt56"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack source tree
        run: tar --exclude=.git --exclude=target -czf /tmp/mixeff-rs-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: mixeff-rs-source
          path: /tmp/mixeff-rs-source.tgz
          retention-days: 3

  baseline-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record runner
        run: |
          rustc --version | tee runner-native.txt
          cargo --version | tee -a runner-native.txt
          lscpu | tee -a runner-native.txt
      - name: Native optimizer tests
        run: cargo test --no-default-features trust_bq
      - name: Native benchmark matrix
        run: cargo run --release --no-default-features --example optimizer_bench_harness | tee baseline-native.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trustbq-baseline-native
          path: |
            baseline-native.csv
            runner-native.txt
          retention-days: 14

  baseline-nlopt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NLopt build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Record runner
        run: |
          rustc --version | tee runner-nlopt.txt
          cargo --version | tee -a runner-nlopt.txt
          lscpu | tee -a runner-nlopt.txt
      - name: NLopt benchmark matrix
        run: cargo run --release --example optimizer_bench_harness | tee baseline-nlopt.csv
      - uses: actions/upload-artifact@v4
        with:
          name: trustbq-baseline-nlopt
          path: |
            baseline-nlopt.csv
            runner-nlopt.txt
          retention-days: 14
