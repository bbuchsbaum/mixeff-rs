[package]
name = "mixeff-wasm-crossed-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "Crossed-LMM fit-time benchmark for mixeff-rs, native and wasm32 (Node)"

# Standalone: not a member of the mixeff-rs package build.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The configuration browser consumers use: default features off (pure-Rust
# TrustBQ, no NLopt). `unstable-internals` only exposes
# `compiler::FixedEffectTestMethod` for the Satterthwaite table; it does not
# change any numerical path.
mixeff-rs = { path = "../../..", default-features = false, features = ["unstable-internals"] }
rand = "0.8"
rand_distr = "0.4"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
debug = false
